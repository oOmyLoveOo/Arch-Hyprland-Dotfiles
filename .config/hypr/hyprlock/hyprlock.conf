# Colors generated by Wallust (dynamic) or copied from the static palette:
# $fg, $fg_strong, $accent, $accent2, $box
source = $HOME/.config/hypr/hyprlock/colors.conf

# BACKGROUND
background {
    monitor =
    path = $HOME/.config/hypr/hyprlock/hyprlock.png
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A")"
    color = $fg
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# Date-Month
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %B")"
    color = $fg
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = 0, 250
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"- %I:%M -")</span>"
    color = $accent2
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 190
    halign = center
    valign = center
}

# Profile-Photo
image {
    monitor =
    path = $HOME/.config/hypr/hyprlock/wuke.png
    border_size = 2
    border_color = $accent
    size = 130
    rounding = -1
    rotate = 0
    reload_time = -1
    position = 0, 40
    halign = center
    valign = center
}

# User box (rectangle behind the name)
shape {
    monitor =
    size = 300, 60
    color = $box
    rounding = -1
    position = 0, -130
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =    $USER
    color = $fg_strong
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent $accent2 45deg
    inner_color = $box
    font_color = $fg_strong
    check_color = $accent2
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i><span foreground="##ffffff99">🔒 Enter Pass</span></i>
    hide_input = false
    position = 0, -210
    halign = center
    valign = center
}

# Power buttons (bottom): clickable labels
label {
    monitor =
    text = 󰐥
    color = $fg
    font_size = 50
    position = -110, 80
    halign = center
    valign = bottom
    onclick = systemctl poweroff
}

label {
    monitor =
    text = 󰜉
    color = $fg
    font_size = 50
    position = 0, 80
    halign = center
    valign = bottom
    onclick = systemctl reboot
}

label {
    monitor =
    text = 󰤄
    color = $fg
    font_size = 50
    position = 110, 80
    halign = center
    valign = bottom
    onclick = systemctl suspend
}
